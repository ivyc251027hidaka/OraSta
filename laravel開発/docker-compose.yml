services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: study-it-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    networks:
      - study-it-network
 
  web:
    image: nginx:stable-alpine
    container_name: study-it-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - study-it-network
 
  db:
    image: mysql:8.0
    container_name: study-it-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: study_it
      MYSQL_USER: study_it_user
      MYSQL_PASSWORD: study_it_pass
      MYSQL_ROOT_PASSWORD: root_pass
      TZ: Asia/Tokyo
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - study-it-db-data:/var/lib/mysql
    networks:
      - study-it-network
 
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: study-it-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root_pass
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - study-it-network
 
networks:
  study-it-network:
    driver: bridge
 
volumes:
  study-it-db-data: